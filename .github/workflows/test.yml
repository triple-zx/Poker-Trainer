name: Test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
concurrency:
  group: tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: runner.os == 'macOS'
        run: brew install libomp
      - run: node native/setup.mjs
      - run: node native/verify-evaluator.mjs
      - run: node native/benchmark.mjs
      - run: node native/verify-full.mjs
      - run: node scripts/verify-evaluator.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-benchmark-${{ runner.os }}
          path: docs/benchmarks/native.json
