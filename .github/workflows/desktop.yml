name: Desktop packages
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make mingw-w64-ucrt-x86_64-cmake
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\ucrt64\bin'
      - if: runner.os == 'macOS'
        run: brew install libomp
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: npm run check
      - run: npm test
      - run: node native/setup.mjs
      - run: npm run desktop:prepare
      - run: npm run desktop:smoke
        timeout-minutes: 2
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node desktop/verify-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Poker-Trainer-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
